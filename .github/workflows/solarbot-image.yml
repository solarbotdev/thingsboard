#
# SolarBot: build ghcr.io/solarbotdev/tb-node:<TB version>-solarbot.<N>
#
# The official thingsboard/tb-node:<TB version> with only the web UI rebuilt
# from this branch (solarbot/Dockerfile). Pushing tag v<TB version>-solarbot.<N>
# builds, smoke-tests and publishes; workflow_dispatch builds and smoke-tests
# without publishing. Image tags are never overwritten: a change is a new N.
#
name: SolarBot image

on:
  push:
    tags:
      - 'v4.3.1.4-solarbot.*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: solarbot-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/solarbotdev/tb-node
  OFFICIAL: thingsboard/tb-node

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve versions
        id: v
        run: |
          set -euo pipefail
          tb="$(python3 -c 'import json;print(json.load(open("ui-ngx/package.json"))["version"])')"
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            # The tag must name the TB version this tree is: a
            # v4.3.1.4-solarbot.N tag on a 4.4 tree would publish a 4.4 UI
            # under a 4.3.1.4 image tag.
            case "${GITHUB_REF_NAME}" in
              "v${tb}-solarbot."[0-9]*) ;;
              *) echo "::error::tag ${GITHUB_REF_NAME} is not v${tb}-solarbot.<N>"; exit 1 ;;
            esac
            tag="${GITHUB_REF_NAME#v}"
            push=true
          else
            tag="${tb}-solarbot.dev-${GITHUB_SHA::12}"
            push=false
          fi
          # Pin the base by digest so the build and the smoke test compare
          # against exactly the same official image.
          digest="$(docker buildx imagetools inspect "${OFFICIAL}:${tb}" --format '{{json .Manifest}}' \
                    | python3 -c 'import json,sys;print(json.load(sys.stdin)["digest"])')"
          echo "tb=${tb}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "push=${push}" >> "$GITHUB_OUTPUT"
          echo "base=${OFFICIAL}:${tb}@${digest}" >> "$GITHUB_OUTPUT"
          echo "TB ${tb}; image ${IMAGE}:${tag}; push ${push}; base ${OFFICIAL}:${tb}@${digest}"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Refuse to overwrite an existing image tag
        if: steps.v.outputs.push == 'true'
        run: |
          if docker buildx imagetools inspect "${IMAGE}:${{ steps.v.outputs.tag }}" >/dev/null 2>&1; then
            echo "::error::${IMAGE}:${{ steps.v.outputs.tag }} already exists; tag a new N instead"
            exit 1
          fi

      - name: Build
        run: |
          set -euo pipefail
          docker pull "${{ steps.v.outputs.base }}"
          docker buildx build --load --platform linux/amd64 \
            -f solarbot/Dockerfile \
            --build-arg TB_VERSION="${{ steps.v.outputs.tb }}" \
            --build-arg TB_BASE_IMAGE="${{ steps.v.outputs.base }}" \
            --build-arg IMAGE_VERSION="${{ steps.v.outputs.tag }}" \
            --build-arg VCS_REF="${GITHUB_SHA}" \
            -t "${IMAGE}:${{ steps.v.outputs.tag }}" .

      - name: "Smoke test: jar contents"
        run: |
          set -euo pipefail
          jar=/usr/share/thingsboard/bin/thingsboard.jar
          mkdir -p smoke
          docker create --name official "${{ steps.v.outputs.base }}" >/dev/null
          docker create --name custom "${IMAGE}:${{ steps.v.outputs.tag }}" >/dev/null
          docker cp "official:${jar}" smoke/official.jar
          docker cp "custom:${jar}" smoke/custom.jar
          docker rm official custom >/dev/null
          unzip -lv smoke/custom.jar | grep -E 'Method|BOOT-INF/lib/ui-ngx-'
          python3 solarbot/verify_image.py smoke/official.jar smoke/custom.jar .
          # The image itself: official layers untouched plus exactly one, and
          # the same user/entrypoint/cmd/env.
          python3 - "${{ steps.v.outputs.base }}" "${IMAGE}:${{ steps.v.outputs.tag }}" <<'EOF'
          import json, subprocess, sys
          o, c = (json.loads(subprocess.check_output(['docker', 'image', 'inspect', r]))[0] for r in sys.argv[1:3])
          lo, lc = o['RootFS']['Layers'], c['RootFS']['Layers']
          ok = lc[:len(lo)] == lo and len(lc) == len(lo) + 1
          print(('PASS' if ok else 'FAIL') + ' official %d layers kept, %d added' % (len(lo), len(lc) - len(lo)))
          bad = [k for k in ('User', 'Entrypoint', 'Cmd', 'Env', 'WorkingDir') if o['Config'].get(k) != c['Config'].get(k)]
          print(('PASS' if not bad else 'FAIL') + ' same config (User/Entrypoint/Cmd/Env/WorkingDir); differing: %s' % bad)
          sys.exit(0 if ok and not bad else 1)
          EOF

      - name: "Smoke test: run it (Postgres 16, install, start, fetch the UI)"
        run: |
          set -euo pipefail
          img="${IMAGE}:${{ steps.v.outputs.tag }}"
          docker network create tbnet >/dev/null
          docker run -d --name pg --network tbnet -e POSTGRES_DB=thingsboard \
            -e POSTGRES_USER=thingsboard -e POSTGRES_PASSWORD=smoke postgres:16 >/dev/null
          for i in $(seq 60); do docker exec pg pg_isready -U thingsboard >/dev/null 2>&1 && break; sleep 2; done
          tbenv=(-e TB_SERVICE_TYPE=monolith -e TB_QUEUE_TYPE=in-memory
                 -e SPRING_DATASOURCE_URL=jdbc:postgresql://pg:5432/thingsboard
                 -e SPRING_DATASOURCE_USERNAME=thingsboard -e SPRING_DATASOURCE_PASSWORD=smoke)
          docker run --rm --network tbnet "${tbenv[@]}" -e INSTALL_TB=true -e LOAD_DEMO=false "$img" > install.log 2>&1 \
            || { tail -100 install.log; exit 1; }
          tail -3 install.log
          docker run -d --name tb --network tbnet -p 127.0.0.1:8080:8080 "${tbenv[@]}" "$img" >/dev/null
          code=000
          for i in $(seq 120); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/ || true)"
            [ "$code" = 200 ] && break
            sleep 5
          done
          [ "$code" = 200 ] || { docker logs --tail 200 tb; echo "::error::UI not up (HTTP ${code})"; exit 1; }
          curl -sf http://127.0.0.1:8080/ | grep -o '<title>[^<]*</title>' | tee title.txt
          grep -qx '<title>SolarBot</title>' title.txt
          want="$(sha256sum < ui-ngx/src/assets/logo_title_white.svg)"
          got="$(curl -sf http://127.0.0.1:8080/assets/logo_title_white.svg | sha256sum)"
          echo "served logo ${got%% *}; repo ${want%% *}"
          [ "$got" = "$want" ]
          want="$(sha256sum < ui-ngx/src/thingsboard.ico)"
          got="$(curl -sf http://127.0.0.1:8080/thingsboard.ico | sha256sum)"
          echo "served favicon ${got%% *}; repo ${want%% *}"
          [ "$got" = "$want" ]
          # The backend answers too: the fresh install's default sysadmin logs in.
          curl -sf -H 'Content-Type: application/json' \
            -d '{"username":"sysadmin@thingsboard.org","password":"sysadmin"}' \
            http://127.0.0.1:8080/api/auth/login | python3 -c 'import json,sys;assert json.load(sys.stdin)["token"];print("PASS backend login")'

      - name: Push
        if: steps.v.outputs.push == 'true'
        run: |
          set -euo pipefail
          docker push "${IMAGE}:${{ steps.v.outputs.tag }}"
          ref="$(docker image inspect --format '{{index .RepoDigests 0}}' "${IMAGE}:${{ steps.v.outputs.tag }}")"
          echo "Published ${IMAGE}:${{ steps.v.outputs.tag }} = ${ref}"
          {
            echo "### ${IMAGE}:${{ steps.v.outputs.tag }}"
            echo "- digest: \`${ref#*@}\`"
            echo "- base: \`${{ steps.v.outputs.base }}\`"
            echo "- source: ${GITHUB_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"
