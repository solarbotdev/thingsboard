#
# SolarBot: build, smoke-test and (optionally) publish
#   ghcr.io/solarbotdev/tb-node:<TB version>-solarbot.<N>
# from a solarbot/v<upstream tag> branch: the official thingsboard/tb-node of
# the same version with only the web UI rebuilt (solarbot/Dockerfile of THAT
# branch; this workflow only orchestrates).
#
# Two entry points, one job:
#   - workflow_dispatch (Actions tab or `gh workflow run solarbot-build.yml
#     -R solarbotdev/thingsboard -f ref=solarbot/v4.3.1.4 -f image_tag=4.3.1.4-solarbot.2`).
#     Empty image_tag = build and smoke-test only, nothing published.
#   - workflow_call from solarbot-weekly.yml. (Pushes made with GITHUB_TOKEN do
#     not trigger workflows, so the weekly job calls this one directly.)
#
# With an image_tag it publishes the image and THEN creates the annotated git
# tag v<image_tag> on the commit it built. Neither an image tag nor a git tag
# is ever overwritten: a change is a new N.
#
name: SolarBot build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or SHA to build (e.g. solarbot/v4.3.1.6)'
        required: true
        type: string
      image_tag:
        description: '<version>-solarbot.<N> to publish; empty = build and test only'
        required: false
        default: ''
        type: string
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      image_tag:
        required: false
        default: ''
        type: string
    outputs:
      image:
        description: 'Published image reference (name:tag@digest); empty when nothing was published'
        value: ${{ jobs.image.outputs.image }}
      digest:
        value: ${{ jobs.image.outputs.digest }}

permissions:
  contents: write   # the git tag v<image_tag>
  packages: write   # push to ghcr.io/solarbotdev/tb-node

env:
  IMAGE: ghcr.io/solarbotdev/tb-node
  OFFICIAL: thingsboard/tb-node

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    concurrency:
      # Two builds of the same image tag (a dispatch racing the weekly run)
      # would both pass the "does not exist yet" check.
      group: solarbot-build-${{ inputs.image_tag || inputs.ref }}
      cancel-in-progress: false
    outputs:
      image: ${{ steps.push.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout ${{ inputs.ref }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Resolve versions
        id: v
        env:
          WANT_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          [ -f solarbot/Dockerfile ] || { echo "::error::${{ inputs.ref }} has no solarbot/Dockerfile; not a SolarBot branch"; exit 1; }
          eval "$(python3 - <<'EOF'
          import json, re, xml.etree.ElementTree as ET
          ns = {'m': 'http://maven.apache.org/POM/4.0.0'}
          ui = json.load(open('ui-ngx/package.json'))['version']
          pom = ET.parse('pom.xml').getroot().find('m:version', ns).text.strip()
          uipom = open('ui-ngx/pom.xml').read()
          node = re.search(r'<nodeVersion>v?([^<]+)</nodeVersion>', uipom).group(1)
          yarn = re.search(r'<yarnVersion>v?([^<]+)</yarnVersion>', uipom).group(1)
          print(f'tb={ui} pom={pom} node={node} yarn={yarn}')
          EOF
          )"
          # The image tag names the TB version of the tree. Both version
          # sources must agree, or a half-merged port could ship one version's
          # UI under the other's tag.
          [ "$tb" = "$pom" ] || { echo "::error::ui-ngx/package.json says ${tb}, pom.xml says ${pom}"; exit 1; }
          if [ -n "${WANT_TAG}" ]; then
            # A 4.4 tree must not be published as 4.3.1.x-solarbot.N (or vice versa).
            [[ "${WANT_TAG}" =~ ^${tb//./\\.}-solarbot\.[1-9][0-9]*$ ]] \
              || { echo "::error::image_tag ${WANT_TAG} is not ${tb}-solarbot.<N> (N >= 1) for this tree"; exit 1; }
            tag="${WANT_TAG}"; push=true
          else
            tag="${tb}-solarbot.dev-${sha::12}"; push=false
          fi
          # Pin the base by digest so the build and the smoke test compare
          # against exactly the same official image.
          digest="$(docker buildx imagetools inspect "${OFFICIAL}:${tb}" --format '{{json .Manifest}}' \
                    | python3 -c 'import json,sys;print(json.load(sys.stdin)["digest"])')"
          {
            echo "sha=${sha}"; echo "tb=${tb}"; echo "tag=${tag}"; echo "push=${push}"
            echo "node=${node}"; echo "yarn=${yarn}"
            echo "base=${OFFICIAL}:${tb}@${digest}"
          } >> "$GITHUB_OUTPUT"
          echo "ref ${{ inputs.ref }} = ${sha}; TB ${tb}; node ${node}; yarn ${yarn}"
          echo "image ${IMAGE}:${tag}; push ${push}; base ${OFFICIAL}:${tb}@${digest}"

      - name: Log in to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Refuse to overwrite an existing image or git tag
        if: steps.v.outputs.push == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.v.outputs.tag }}"
          if docker buildx imagetools inspect "${IMAGE}:${tag}" >/dev/null 2>&1; then
            echo "::error::${IMAGE}:${tag} already exists; use a new N"; exit 1
          fi
          # A git tag without its image means an earlier run died between the
          # two; moving the tag is forbidden, so a human decides.
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${tag}" >/dev/null 2>&1; then
            echo "::error::git tag v${tag} already exists without image ${IMAGE}:${tag}; use a new N"; exit 1
          fi

      - name: Build
        run: |
          set -euo pipefail
          docker pull "${{ steps.v.outputs.base }}"
          docker buildx build --load --platform linux/amd64 \
            -f solarbot/Dockerfile \
            --build-arg TB_VERSION="${{ steps.v.outputs.tb }}" \
            --build-arg TB_BASE_IMAGE="${{ steps.v.outputs.base }}" \
            --build-arg NODE_VERSION="${{ steps.v.outputs.node }}" \
            --build-arg YARN_VERSION="${{ steps.v.outputs.yarn }}" \
            --build-arg IMAGE_VERSION="${{ steps.v.outputs.tag }}" \
            --build-arg VCS_REF="${{ steps.v.outputs.sha }}" \
            -t "${IMAGE}:${{ steps.v.outputs.tag }}" .

      - name: "Smoke test: jar contents"
        run: |
          set -euo pipefail
          jar=/usr/share/thingsboard/bin/thingsboard.jar
          mkdir -p smoke
          docker create --name official "${{ steps.v.outputs.base }}" >/dev/null
          docker create --name custom "${IMAGE}:${{ steps.v.outputs.tag }}" >/dev/null
          docker cp "official:${jar}" smoke/official.jar
          docker cp "custom:${jar}" smoke/custom.jar
          docker rm official custom >/dev/null
          unzip -lv smoke/custom.jar | grep -E 'Method|BOOT-INF/lib/ui-ngx-'
          # (a) ui-ngx jar STORED, (b) title/logo/favicon, (c) every other
          # entry and the launch script identical to the official jar.
          python3 solarbot/verify_image.py smoke/official.jar smoke/custom.jar .
          # The image itself: official layers untouched plus exactly one, and
          # the same user/entrypoint/cmd/env.
          python3 - "${{ steps.v.outputs.base }}" "${IMAGE}:${{ steps.v.outputs.tag }}" <<'EOF'
          import json, subprocess, sys
          o, c = (json.loads(subprocess.check_output(['docker', 'image', 'inspect', r]))[0] for r in sys.argv[1:3])
          lo, lc = o['RootFS']['Layers'], c['RootFS']['Layers']
          ok = lc[:len(lo)] == lo and len(lc) == len(lo) + 1
          print(('PASS' if ok else 'FAIL') + ' official %d layers kept, %d added' % (len(lo), len(lc) - len(lo)))
          bad = [k for k in ('User', 'Entrypoint', 'Cmd', 'Env', 'WorkingDir') if o['Config'].get(k) != c['Config'].get(k)]
          print(('PASS' if not bad else 'FAIL') + ' same config (User/Entrypoint/Cmd/Env/WorkingDir); differing: %s' % bad)
          sys.exit(0 if ok and not bad else 1)
          EOF

      - name: "Smoke test: run it (Postgres 16, install, start, fetch the UI, log in)"
        run: |
          set -euo pipefail
          img="${IMAGE}:${{ steps.v.outputs.tag }}"
          docker network create tbnet >/dev/null
          docker run -d --name pg --network tbnet -e POSTGRES_DB=thingsboard \
            -e POSTGRES_USER=thingsboard -e POSTGRES_PASSWORD=smoke postgres:16 >/dev/null
          for i in $(seq 60); do docker exec pg pg_isready -U thingsboard >/dev/null 2>&1 && break; sleep 2; done
          tbenv=(-e TB_SERVICE_TYPE=monolith -e TB_QUEUE_TYPE=in-memory
                 -e SPRING_DATASOURCE_URL=jdbc:postgresql://pg:5432/thingsboard
                 -e SPRING_DATASOURCE_USERNAME=thingsboard -e SPRING_DATASOURCE_PASSWORD=smoke)
          docker run --rm --network tbnet "${tbenv[@]}" -e INSTALL_TB=true -e LOAD_DEMO=false "$img" > install.log 2>&1 \
            || { tail -100 install.log; exit 1; }
          tail -3 install.log
          docker run -d --name tb --network tbnet -p 127.0.0.1:8080:8080 "${tbenv[@]}" "$img" >/dev/null
          code=000
          for i in $(seq 120); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/ || true)"
            [ "$code" = 200 ] && break
            sleep 5
          done
          [ "$code" = 200 ] || { docker logs --tail 200 tb; echo "::error::UI not up (HTTP ${code})"; exit 1; }
          curl -sf http://127.0.0.1:8080/ | grep -o '<title>[^<]*</title>' | tee title.txt
          grep -qx '<title>SolarBot</title>' title.txt
          want="$(sha256sum < ui-ngx/src/assets/logo_title_white.svg)"
          got="$(curl -sf http://127.0.0.1:8080/assets/logo_title_white.svg | sha256sum)"
          echo "served logo ${got%% *}; repo ${want%% *}"
          [ "$got" = "$want" ]
          want="$(sha256sum < ui-ngx/src/thingsboard.ico)"
          got="$(curl -sf http://127.0.0.1:8080/thingsboard.ico | sha256sum)"
          echo "served favicon ${got%% *}; repo ${want%% *}"
          [ "$got" = "$want" ]
          # The backend answers too: the fresh install's default sysadmin logs in.
          curl -sf -H 'Content-Type: application/json' \
            -d '{"username":"sysadmin@thingsboard.org","password":"sysadmin"}' \
            http://127.0.0.1:8080/api/auth/login | python3 -c 'import json,sys;assert json.load(sys.stdin)["token"];print("PASS backend login")'

      - name: Push
        id: push
        if: steps.v.outputs.push == 'true'
        run: |
          set -euo pipefail
          docker push "${IMAGE}:${{ steps.v.outputs.tag }}"
          ref="$(docker image inspect --format '{{index .RepoDigests 0}}' "${IMAGE}:${{ steps.v.outputs.tag }}")"
          echo "Published ${IMAGE}:${{ steps.v.outputs.tag }} = ${ref}"
          echo "image=${IMAGE}:${{ steps.v.outputs.tag }}@${ref#*@}" >> "$GITHUB_OUTPUT"
          echo "digest=${ref#*@}" >> "$GITHUB_OUTPUT"
          {
            echo "### ${IMAGE}:${{ steps.v.outputs.tag }}"
            echo "- digest: \`${ref#*@}\`"
            echo "- base: \`${{ steps.v.outputs.base }}\`"
            echo "- source: ${{ inputs.ref }} = ${{ steps.v.outputs.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Git tag v${{ steps.v.outputs.tag }}
        if: steps.v.outputs.push == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${{ steps.v.outputs.tag }}"
          # Annotated, like v4.3.1.4-solarbot.1; created only now that the
          # image it names exists. POST git/refs fails if the tag appeared
          # meanwhile, so it is never moved.
          obj="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags" \
                   -f tag="$tag" -f type=commit -f object="${{ steps.v.outputs.sha }}" \
                   -f message="SolarBot build of ThingsBoard ${{ steps.v.outputs.tb }} (UI only): ${{ steps.push.outputs.image }}" \
                   --jq .sha)"
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${tag}" -f sha="$obj" --jq .ref
          echo "- git tag: \`${tag}\` -> ${{ steps.v.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
