#
# SolarBot weekly: keep ghcr.io/solarbotdev/tb-node images coming for new
# stable ThingsBoard releases.
#
#   plan    solarbot/weekly.py plan: upstream releases (non-draft,
#           non-prerelease, ^v\d+(\.\d+){1,3}$) vs. existing image tags.
#           Targets: the newest release if newer than every image, and the
#           newest patch of the line of every solarbot/v* branch, minus what
#           already has an image. Only releases whose LICENSE first line
#           says Apache License are built; others (4.4+, BUSL-1.1) get one
#           "decision needed" issue and are never built automatically.
#   port    per target: solarbot/v<tag> from the upstream tag + cherry-pick of
#           `git rev-list <prev upstream tag>..solarbot/v<prev>` (commits that
#           only touch .github/ skipped); push the branch. An existing branch
#           (earlier run, or hand-fixed) is reused after checking its base.
#   build   per target: the reusable solarbot-build.yml, which publishes
#           <version>-solarbot.1 and creates git tag v<version>-solarbot.1
#           only after the smoke tests pass.
#   report  solarbot/weekly.py report: issue per failure (one per version,
#           updated, never duplicated), "image ready - manual upgrade" for a
#           new minor/major line, one license issue per non-Apache release.
#
# Idempotent: a target with an image is never selected again; a failed one is
# retried next week (its issue gets a comment).
#
# Schedule: Saturday 06:00 UTC. The VPS's own update cron runs Sunday 04:47
# UTC, so a release published Monday-Friday is built ~23 h before the VPS
# looks, with Saturday left to hand-fix a failed port and re-run this by hand
# (workflow_dispatch) before Sunday. A Monday run would leave the image idle
# for six days.
#
name: SolarBot weekly

on:
  schedule:
    - cron: '0 6 * * 6'
  workflow_dispatch:
    inputs:
      push_test:
        description: >-
          Only test the push credential: push a throwaway branch
          solarbot/pushkey-test whose history includes upstream workflow
          commits, then delete it. No plan, no tag, no build.
        type: boolean
        default: false

permissions:
  contents: write   # push solarbot/v* branches, git tags (in the build)
  packages: write   # the build pushes the image
  issues: write
  actions: write    # read this run's jobs for the report; keep the schedule enabled

concurrency:
  group: solarbot-weekly
  cancel-in-progress: false

jobs:
  plan:
    if: ${{ !inputs.push_test }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      targets: ${{ steps.plan.outputs.targets }}
      blocked: ${{ steps.plan.outputs.blocked }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 solarbot/weekly.py plan

  port:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    name: port ${{ matrix.t.tag }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        t: ${{ fromJSON(needs.plan.outputs.targets) }}
    env:
      TAG: ${{ matrix.t.tag }}
      VERSION: ${{ matrix.t.version }}
      BRANCH: ${{ matrix.t.branch }}
      PREV_BRANCH: ${{ matrix.t.prev_branch }}
      PREV_TAG: ${{ matrix.t.prev_tag }}
      # GITHUB_TOKEN may not push commits that create or change workflow
      # files, and upstream release history contains such commits. Push
      # credential, first that is set: SOLARBOT_PUSH_KEY (write deploy key,
      # over SSH; not subject to that rule), SOLARBOT_PUSH_TOKEN (fine-grained
      # PAT, Contents + Workflows), else GITHUB_TOKEN. Tags and API calls stay
      # on GITHUB_TOKEN. See solarbot/README.md.
      PUSH_KEY: ${{ secrets.SOLARBOT_PUSH_KEY }}
      PUSH_TOKEN: ${{ secrets.SOLARBOT_PUSH_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: ci
          persist-credentials: false
      - name: Port ${{ matrix.t.prev_branch }} onto ${{ matrix.t.tag }}
        run: |
          set -euo pipefail
          die() { echo "::error::$*"; exit 1; }
          git init -q port && cd port
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add origin "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git remote add upstream https://github.com/thingsboard/thingsboard.git
          . "${GITHUB_WORKSPACE}/ci/solarbot/push-auth.sh"
          trap push_auth_cleanup EXIT
          push_auth_setup

          if git ls-remote --exit-code origin "refs/heads/${BRANCH}" >/dev/null; then
            # Left by an earlier run whose build failed, or pushed by a human
            # who hand-fixed a conflict: build it as is, if it sits on the tag.
            git fetch -q --depth=300 origin "refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}"
            git fetch -q --depth=1 upstream "refs/tags/${TAG}:refs/tags/${TAG}"
            git merge-base --is-ancestor "${TAG}" "origin/${BRANCH}" \
              || die "${BRANCH} exists but is not based on upstream ${TAG}"
            echo "${BRANCH} exists on ${TAG}: $(git rev-list --count "${TAG}..origin/${BRANCH}") commit(s) on top; reused" \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Source range. The branch is fetched first and deep enough to
          # reach its upstream tag; fetching the tag afterwards then only
          # marks the tag commit as the shallow boundary.
          git fetch -q --depth=100 origin "refs/heads/${PREV_BRANCH}:refs/remotes/origin/${PREV_BRANCH}"
          git fetch -q --depth=1 upstream "refs/tags/${PREV_TAG}:refs/tags/${PREV_TAG}" "refs/tags/${TAG}:refs/tags/${TAG}"
          # Without this a shallow history would make rev-list return every
          # fetched commit, upstream's included.
          git merge-base --is-ancestor "${PREV_TAG}" "origin/${PREV_BRANCH}" \
            || die "${PREV_BRANCH} is not based on ${PREV_TAG} (or has more than 100 commits on top)"
          [ "$(git rev-list --count --merges "${PREV_TAG}..origin/${PREV_BRANCH}")" = 0 ] \
            || die "${PREV_BRANCH} has merge commits on top of ${PREV_TAG}; port by hand"
          mapfile -t commits < <(git rev-list --reverse "${PREV_TAG}..origin/${PREV_BRANCH}")
          [ "${#commits[@]}" -gt 0 ] || die "nothing between ${PREV_TAG} and ${PREV_BRANCH}"
          echo "porting ${#commits[@]} commit(s) of ${PREV_BRANCH} onto ${TAG}"

          git checkout -q -b "${BRANCH}" "${TAG}^{commit}"
          for c in "${commits[@]}"; do
            subject="$(git log -1 --format=%s "$c")"
            files="$(git diff-tree --no-commit-id --name-only -r "$c")"
            if ! grep -qv '^\.github/' <<<"$files"; then
              echo "skip ${c::10} ${subject} (only .github/)"; continue
            fi
            # Workflow files stay off version branches (see PUSH_TOKEN above).
            ! grep -q '^\.github/' <<<"$files" || die "${c::10} ${subject} mixes .github/ with other files"
            if git cherry-pick "$c" >/dev/null 2>&1; then
              echo "pick ${c::10} ${subject}"
            elif [ -z "$(git diff --name-only --diff-filter=U)" ] && git diff --cached --quiet; then
              echo "skip ${c::10} ${subject} (already upstream: empty)"; git cherry-pick --skip
            else
              {
                echo "### Cherry-pick conflict porting ${PREV_BRANCH} onto ${TAG}"
                echo "Commit \`${c::10}\` ${subject}; conflicted files:"
                git diff --name-only --diff-filter=U | sed 's/^/- /'
              } | tee -a "$GITHUB_STEP_SUMMARY"
              die "cherry-pick of ${c::10} (${subject}) conflicts"
            fi
          done

          # The port changes no workflow and is the version the build expects.
          ! git diff --name-only "${TAG}" HEAD | grep -q '^\.github/' || die "port touches .github/"
          [ "$(python3 -c 'import json;print(json.load(open("ui-ngx/package.json"))["version"])')" = "${VERSION}" ] \
            || die "ui-ngx/package.json is not ${VERSION}"
          if ! git push origin "HEAD:refs/heads/${BRANCH}" 2>&1 | tee push.log || grep -q 'rejected' push.log; then
            if grep -q 'without `workflows` permission' push.log; then
              {
                echo "### Push of ${BRANCH} refused: upstream ${TAG}'s own history changes workflow files"
                echo "The cherry-picks applied cleanly. Either set the deploy-key secret SOLARBOT_PUSH_KEY"
                echo "(or a token with Workflows write as SOLARBOT_PUSH_TOKEN), or push the same port by hand (solarbot/README.md, \"Hand-fixing a port\")"
                echo "and re-run this workflow: it reuses an existing branch."
              } | tee -a "$GITHUB_STEP_SUMMARY"
            fi
            die "push of ${BRANCH} failed"
          fi
          echo "pushed ${BRANCH} = $(git rev-parse HEAD) ($(git rev-list --count "${TAG}..HEAD") commit(s) on ${TAG}) via ${PUSH_MODE}" \
            | tee -a "$GITHUB_STEP_SUMMARY"

  pushtest:
    if: ${{ inputs.push_test }}
    name: push credential test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TEST_BRANCH: solarbot/pushkey-test
      PUSH_KEY: ${{ secrets.SOLARBOT_PUSH_KEY }}
      PUSH_TOKEN: ${{ secrets.SOLARBOT_PUSH_TOKEN || github.token }}
      GH_CONTRAST_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: ci
          persist-credentials: false
      - name: Push a branch with upstream workflow history, then delete it
        run: |
          set -euo pipefail
          die() { echo "::error::$*"; exit 1; }
          [ "${TEST_BRANCH}" = solarbot/pushkey-test ] || die "unexpected test branch"
          git init -q t && cd t
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add origin "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          . "${GITHUB_WORKSPACE}/ci/solarbot/push-auth.sh"
          cleanup() {
            # Always remove the test branch, then the key.
            if git ls-remote --exit-code origin "refs/heads/${TEST_BRANCH}" >/dev/null 2>&1; then
              git push origin --delete "${TEST_BRANCH}" || echo "::warning::could not delete ${TEST_BRANCH}"
            fi
            push_auth_cleanup
          }
          trap cleanup EXIT
          push_auth_setup

          # Full history of the existing remote branches, so that only the
          # missing upstream commits are fetched and pushed.
          git fetch -q --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          cand=""
          for t in v4.3.1.5 v4.2.2.6 v4.2.2.5 v4.2.2.4; do
            git fetch -q --no-tags https://github.com/thingsboard/thingsboard.git "refs/tags/${t}:refs/tags/${t}"
            n="$(git rev-list --count "${t}" --not --remotes=origin -- .github/workflows)"
            echo "${t}: ${n} workflow-touching commit(s) absent from origin"
            if [ "$n" -gt 0 ]; then cand="$t"; break; fi
          done
          [ -n "$cand" ] || die "no candidate tag has workflow commits absent from origin"
          echo "test tag ${cand}: $(git rev-list --count "${cand}" --not --remotes=origin) commit(s) to push"

          if git ls-remote --exit-code origin "refs/heads/${TEST_BRANCH}" >/dev/null 2>&1; then
            die "${TEST_BRANCH} already exists on origin; remove it first"
          fi

          # Contrast: GITHUB_TOKEN over HTTPS is expected to be refused.
          echo "--- contrast: HTTPS with GITHUB_TOKEN (expected: refused) ---"
          git push "https://x-access-token:${GH_CONTRAST_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "refs/tags/${cand}:refs/heads/${TEST_BRANCH}" || echo "(refused, as expected)"
          if git ls-remote --exit-code origin "refs/heads/${TEST_BRANCH}" >/dev/null 2>&1; then
            echo "::warning::GITHUB_TOKEN push was NOT refused; removing the branch before the real test"
            git push origin --delete "${TEST_BRANCH}"
          fi

          echo "--- push with the configured credential (${PUSH_MODE}) ---"
          git push origin "refs/tags/${cand}:refs/heads/${TEST_BRANCH}" \
            || die "push with the ${PUSH_MODE} credential failed"
          echo "push OK via ${PUSH_MODE}: ${TEST_BRANCH} = $(git rev-parse "${cand}^{commit}") (tag ${cand})" | tee -a "$GITHUB_STEP_SUMMARY"
          git push origin --delete "${TEST_BRANCH}" || die "delete of ${TEST_BRANCH} failed"
          echo "deleted ${TEST_BRANCH}" | tee -a "$GITHUB_STEP_SUMMARY"

  build:
    needs: [plan, port]
    # Also after a failed port leg: each leg builds its own branch, and one
    # that was not pushed fails at checkout, which the report turns into an issue.
    if: always() && needs.plan.outputs.any == 'true'
    name: build ${{ matrix.t.tag }}
    strategy:
      fail-fast: false
      matrix:
        t: ${{ fromJSON(needs.plan.outputs.targets) }}
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/solarbot-build.yml
    with:
      ref: ${{ matrix.t.branch }}
      image_tag: ${{ matrix.t.image_tag }}

  report:
    needs: [plan, port, build]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Issues
        env:
          GH_TOKEN: ${{ github.token }}
          TARGETS: ${{ needs.plan.outputs.targets }}
          BLOCKED: ${{ needs.plan.outputs.blocked }}
        run: python3 solarbot/weekly.py report
      - name: Keep the schedule enabled
        # GitHub disables scheduled workflows of a public repo after 60 days
        # without repository activity; re-enabling through the API each run
        # keeps a quiet fork's weekly job alive.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/solarbot-weekly.yml/enable" || true
